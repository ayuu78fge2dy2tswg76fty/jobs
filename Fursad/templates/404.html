<!DOCTYPE html>
<html lang="so">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Bogga Waa La Waayay | Fursad</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700;900&display=swap');

        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
            perspective: 1000px;
        }

        /* Background Effects */
        .bg-glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(79,70,229,0.15) 0%, rgba(15,23,42,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            animation: pulseGlow 4s infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 3rem;
            max-width: 650px;
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(40px);
            transform-style: preserve-3d;
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Glitch Effect on 404 */
        .error-code {
            font-size: 8rem;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            position: relative;
            display: inline-block;
            transform: translateZ(30px);
        }

        .error-code::before, .error-code::after {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.8;
        }

        .error-code::before {
            color: #0ff;
            z-index: -1;
            animation: glitch-anim-1 2.5s infinite linear alternate-reverse;
        }

        .error-code::after {
            color: #f0f;
            z-index: -2;
            animation: glitch-anim-2 3s infinite linear alternate-reverse;
        }

        @keyframes glitch-anim-1 {
            0% { clip-path: inset(20% 0 80% 0); transform: translate(-2px, 1px); }
            20% { clip-path: inset(60% 0 10% 0); transform: translate(2px, -1px); }
            40% { clip-path: inset(40% 0 50% 0); transform: translate(-2px, 2px); }
            60% { clip-path: inset(80% 0 5% 0); transform: translate(2px, -2px); }
            80% { clip-path: inset(10% 0 70% 0); transform: translate(-1px, 1px); }
            100% { clip-path: inset(30% 0 50% 0); transform: translate(1px, -1px); }
        }

        @keyframes glitch-anim-2 {
            0% { clip-path: inset(10% 0 60% 0); transform: translate(2px, 1px); }
            20% { clip-path: inset(30% 0 20% 0); transform: translate(-2px, -1px); }
            40% { clip-path: inset(70% 0 10% 0); transform: translate(2px, 2px); }
            60% { clip-path: inset(20% 0 50% 0); transform: translate(-2px, -2px); }
            80% { clip-path: inset(50% 0 30% 0); transform: translate(1px, 1px); }
            100% { clip-path: inset(5% 0 80% 0); transform: translate(-1px, -1px); }
        }

        .illustration {
            width: 180px;
            margin: 0 auto 1.5rem;
            animation: float 6s ease-in-out infinite;
            transform: translateZ(40px);
        }

        @keyframes float {
            0% { transform: translateZ(40px) translateY(0px) rotate(0deg); }
            50% { transform: translateZ(40px) translateY(-20px) rotate(5deg); }
            100% { transform: translateZ(40px) translateY(0px) rotate(0deg); }
        }

        h1 {
            font-size: 2.2rem;
            margin-bottom: 1rem;
            font-weight: 700;
            transform: translateZ(20px);
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 2.5rem;
            line-height: 1.6;
            transform: translateZ(15px);
        }

        .btn-home {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 1rem 2.5rem;
            background-color: var(--primary);
            color: white;
            text-decoration: none;
            border-radius: 9999px;
            font-weight: 500;
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-shadow: 0 10px 25px -5px rgba(79, 70, 229, 0.4);
            position: relative;
            overflow: hidden;
            transform: translateZ(25px);
        }

        .btn-home::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s ease;
        }

        .btn-home:hover {
            background-color: var(--primary-hover);
            transform: translateZ(30px) translateY(-3px) scale(1.05);
            box-shadow: 0 20px 25px -5px rgba(79, 70, 229, 0.5);
        }

        .btn-home:hover::before {
            left: 100%;
        }

        .btn-home svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .btn-home:hover svg {
            transform: translateX(-5px);
        }

        /* Floating stars/particles */
        .particles {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 1;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            background: white;
            border-radius: 50%;
            opacity: 0.3;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
        }

        @keyframes twinkle {
            0% { opacity: 0.1; transform: scale(0.8); }
            100% { opacity: 0.8; transform: scale(1.2); }
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    
    <!-- JavaScript will generate particles here -->
    <div class="particles" id="particles"></div>

    <div class="container" id="card">
        <!-- SVG Ghost/UFO Illustration -->
        <svg class="illustration" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#c084fc;stop-opacity:1" />
                </linearGradient>
            </defs>
            <path d="M256 16C163.4 16 88 91.4 88 184c0 40 14.1 76.5 37.4 105.1l-22.3 84.7c-5.5 21 16.5 38.3 35.7 28.1l69.7-36.9c14.6 3.5 29.8 5.4 45.5 5.4s30.9-1.9 45.5-5.4l69.7 36.9c19.2 10.2 41.2-7.1 35.7-28.1l-22.3-84.7C409.9 260.5 424 224 424 184c0-92.6-75.4-168-168-168zm-64 192c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32zm128 0c-17.7 0-32-14.3-32-32s14.3-32 32-32 32 14.3 32 32-14.3 32-32 32z" fill="url(#grad1)"/>
            <path d="M192 144c-17.7 0-32 14.3-32 32s14.3 32 32 32 32-14.3 32-32-14.3-32-32-32z" fill="#0f172a"/>
            <path d="M320 144c-17.7 0-32 14.3-32 32s14.3 32 32 32 32-14.3 32-32-14.3-32-32-32z" fill="#0f172a"/>
        </svg>

        <div class="error-code" data-text="404">404</div>
        <h1>Oops! Boggaan Waa La Waayay</h1>
        <p>Waxay u muuqataa in bogga aad raadineyso uu Maqanyaha  . Laga yaabee in meesha laga saaray, ama aad khaldad ku qortay cinwaanka. Ha ka welwelin, aan kugu celino halkii saxda ahayd.</p>
        
        <a href="/" class="btn-home">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
            </svg>
            Ku Noqo Bogga Hore
        </a>
    </div>

    <script>
        // Generate random floating particles
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.classList.add('particle');
            
            // Random properties
            const size = Math.random() * 4 + 1;
            const posX = Math.random() * 100;
            const posY = Math.random() * 100;
            const duration = Math.random() * 3 + 2;
            
            particle.style.width = `${size}px`;
            particle.style.height = `${size}px`;
            particle.style.left = `${posX}%`;
            particle.style.top = `${posY}%`;
            particle.style.setProperty('--duration', `${duration}s`);
            
            particlesContainer.appendChild(particle);
        }

        // Add 3D mouse tracking effect on the container
        const card = document.getElementById('card');
        
        document.addEventListener('mousemove', (e) => {
            // Smoothly track mouse position relative to center of screen
            const xAxis = (window.innerWidth / 2 - e.pageX) / 30;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 30;
            
            card.style.transform = `translateY(0) rotateY(${-xAxis}deg) rotateX(${yAxis}deg)`;
        });

        // Reset transform on mouse leave smoothly
        document.addEventListener('mouseleave', () => {
            card.style.transition = `transform 0.5s ease`;
            card.style.transform = `translateY(0) rotateY(0deg) rotateX(0deg)`;
            
            // Remove transition after it completes to restore smooth mouse tracking
            setTimeout(() => {
                card.style.transition = `none`;
            }, 500);
        });
    </script>
</body>
</html>
